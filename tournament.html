<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#0f1f2e" />
<title>Catannis — Tournament</title>
<style>
  :root {
    --bg: #0f1f2e; --panel: #16293b; --panel-2: #1d3346; --line: #2c455c;
    --text: #e8eef4; --muted: #8fa6bb; --accent: #ffb347; --accent-2: #4aa3df;
    --good: #6ac47a; --bad: #e0664f; --gold: #ffcf5c;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  a { color: var(--accent-2); }
  .wrap { max-width: 860px; margin: 0 auto; padding: 18px 16px 80px; }

  header.top {
    display: flex; align-items: center; gap: 12px; margin-bottom: 18px; flex-wrap: wrap;
  }
  .brand { font-size: 22px; font-weight: 800; margin: 0; }
  .brand span { color: var(--accent); }
  .top .spacer { flex: 1; }
  .pill {
    font-size: 12px; color: var(--muted); background: var(--panel);
    border: 1px solid var(--line); border-radius: 20px; padding: 4px 12px;
  }

  h2 { font-size: 15px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted);
       margin: 22px 0 10px; font-weight: 700; }
  h3 { margin: 0 0 8px; font-size: 16px; }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
          padding: 16px; margin-bottom: 14px; }
  label.field { display: block; font-size: 13px; color: var(--muted); margin: 0 0 4px; font-weight: 600; }
  input[type=text], input[type=number], textarea, select {
    width: 100%; padding: 10px 11px; font-size: 16px; font-family: inherit;   /* 16px avoids iOS zoom-on-focus */
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; color: var(--text);
  }
  textarea { resize: vertical; min-height: 120px; line-height: 1.5; }
  input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent-2); }
  .row { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
  .row > div { flex: 1; min-width: 90px; }

  button { font-family: inherit; font-weight: 700; cursor: pointer; border: none; border-radius: 8px;
           transition: filter .15s, transform .05s; }
  button:active { transform: translateY(1px); }
  .btn { padding: 11px 16px; font-size: 14px; background: var(--panel-2); color: var(--text);
         border: 1px solid var(--line); }
  .btn:hover { border-color: var(--accent-2); }
  .btn.on { border-color: var(--accent); color: var(--accent); }
  .btn-primary { padding: 13px 18px; font-size: 15px; color: #2a1a00;
                 background: linear-gradient(135deg, var(--accent), #ff9838); }
  .btn-primary:hover { filter: brightness(1.05); }
  .btn-sm { padding: 8px 12px; font-size: 12px; }
  .btn-danger { background: transparent; border: 1px solid var(--line); color: var(--bad); }
  .btnbar { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px; }

  .chk { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 600;
         background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px;
         padding: 9px 11px; cursor: pointer; user-select: none; }
  .chk input { width: 15px; height: 15px; accent-color: var(--accent); }

  .tables-tmpl .trow { display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 10px; margin-bottom: 8px; }
  .tables-tmpl .trow .tname { font-weight: 700; min-width: 66px; }
  .stepper { display: inline-flex; align-items: center; gap: 0; }
  .stepper button { width: 40px; height: 40px; font-size: 18px; background: var(--panel); border: 1px solid var(--line); color: var(--text); }
  .stepper .val { min-width: 36px; text-align: center; font-weight: 700; font-size: 16px; }

  .seatinfo { font-size: 13px; margin-top: 6px; line-height: 1.5; }
  .seatinfo.ok { color: var(--good); }
  .seatinfo.bad { color: var(--bad); }

  /* run view */
  .roundbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .roundbar .title { font-size: 18px; font-weight: 800; margin-right: 2px; }
  .navpills { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .table-card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
  .table-card.done { border-color: #35604a; }
  .table-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
  .table-head .tt { font-size: 16px; font-weight: 800; }
  .tag { font-size: 11px; color: var(--muted); background: var(--panel-2); border: 1px solid var(--line);
         border-radius: 20px; padding: 2px 9px; }
  .tag.exp { color: var(--gold); }

  /* map preview */
  .mapwrap { margin-bottom: 12px; }
  .mapframe { width: 100%; height: 360px; border: 1px solid var(--line); border-radius: 12px;
              background: #14507c; display: block; }

  /* VP entry + finished rows */
  .vprow { display: flex; align-items: center; gap: 9px; padding: 8px 8px; margin-bottom: 6px;
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; }
  .vprow.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .vprow.movable .pname { cursor: pointer; }
  .vprow .pname { flex: 1; font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .vprow input.vp { width: 64px; padding: 8px 6px; text-align: center; font-weight: 700; }
  .vprow.empty { border-style: dashed; color: var(--muted); }
  .vprow.empty.movable { cursor: pointer; }
  .vprow.empty.movable:hover { border-color: var(--accent-2); }
  .posbadge { min-width: 34px; text-align: center; font-weight: 800; font-size: 13px; color: var(--muted); }
  .posbadge.r1 { color: var(--gold); } .posbadge.r2 { color: #c9d2da; } .posbadge.r3 { color: #cd8b5b; }
  .seat { display: flex; align-items: center; gap: 8px; padding: 7px 0; border-top: 1px solid var(--line); }
  .seat:first-of-type { border-top: none; }
  .seat .pname { flex: 1; font-weight: 600; }
  .rankbadge { width: 26px; height: 26px; flex: 0 0 auto; border-radius: 50%; display: inline-flex; align-items: center;
    justify-content: center; font-weight: 800; font-size: 13px; background: var(--panel-2); border: 1px solid var(--line); }
  .rankbadge.r1 { background: var(--gold); color: #3a2c00; border-color: var(--gold); }
  .rankbadge.r2 { background: #c9d2da; color: #22303a; }
  .rankbadge.r3 { background: #cd8b5b; color: #2a1600; }
  .seedchip { font-size: 10px; font-weight: 800; color: var(--accent-2); background: rgba(74,163,223,.12);
    border: 1px solid rgba(74,163,223,.4); border-radius: 10px; padding: 1px 7px; flex: 0 0 auto; }

  /* bench */
  .bench { border-style: dashed; }
  .bench.droppable { border-color: var(--accent-2); }
  .bench .bt { font-weight: 800; font-size: 14px; margin-bottom: 6px; }

  /* players panel */
  .pmrow { display: flex; align-items: center; gap: 9px; padding: 8px; margin-bottom: 6px;
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; }
  .pmrow .pname { flex: 1; font-weight: 600; min-width: 0; }
  .pmrow.out .pname { color: var(--muted); text-decoration: line-through; }
  .pmrow .tagout { font-size: 10px; color: var(--bad); border: 1px solid var(--bad); border-radius: 10px; padding: 1px 7px; }
  .addrow { display: flex; gap: 8px; margin-top: 10px; }
  .addrow input { flex: 1; min-width: 0; }

  /* standings */
  .tablescroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table.stand { width: 100%; min-width: 320px; border-collapse: collapse; font-size: 14px; }
  table.stand th, table.stand td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); }
  table.stand th { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .5px; }
  table.stand td.num { text-align: right; font-variant-numeric: tabular-nums; }
  table.stand tr.cut td { background: rgba(106,196,122,.10); }
  table.stand tr.cutline td { border-bottom: 2px dashed var(--good); }
  .rankcell { font-weight: 800; color: var(--muted); }

  /* bracket */
  .bracketscroll { overflow-x: auto; -webkit-overflow-scrolling: touch; padding: 6px 2px 14px; }
  .bracket { display: flex; gap: 10px; align-items: center; min-width: max-content; }
  .bcol { display: flex; flex-direction: column; justify-content: center; gap: 14px; min-width: 200px; }
  .bcol > h4 { margin: 0 0 2px; font-size: 12px; text-transform: uppercase; letter-spacing: 1px;
    color: var(--muted); text-align: center; }
  .bbox { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
  .bbox .bt { font-size: 12px; font-weight: 800; color: var(--muted); margin-bottom: 6px; }
  .brow { display: flex; align-items: center; gap: 7px; padding: 4px 2px; font-size: 13px; }
  .brow .pname { flex: 1; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .brow.win .pname { color: var(--gold); }
  .brow.dim { color: var(--muted); }
  .brow .bvp { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .bjoin { color: var(--line); font-size: 22px; font-weight: 800; align-self: center; padding: 0 2px; }
  .bchamp { text-align: center; padding: 16px 14px; border-color: var(--gold); }
  .bchamp .who { font-size: 17px; font-weight: 800; color: var(--gold); margin-top: 4px; }

  .podium { display: flex; justify-content: center; align-items: flex-end; gap: 12px; margin: 20px 0; }
  .podium .p { text-align: center; }
  .podium .bar { border-radius: 8px 8px 0 0; width: 84px; display: flex; align-items: flex-start;
    justify-content: center; padding-top: 8px; font-weight: 800; color: #22303a; }
  .podium .p1 .bar { height: 120px; background: var(--gold); }
  .podium .p2 .bar { height: 88px; background: #c9d2da; }
  .podium .p3 .bar { height: 64px; background: #cd8b5b; }
  .podium .who { margin-top: 6px; font-weight: 700; }

  .muted { color: var(--muted); }
  .hint { font-size: 12px; color: var(--muted); line-height: 1.5; }
  .center { text-align: center; }
  .champ { font-size: 26px; font-weight: 800; color: var(--gold); text-align: center; margin: 10px 0; }

  /* ---- phone ---- */
  @media (max-width: 560px) {
    .wrap { padding: 12px 10px 96px; }
    .brand { font-size: 18px; }
    .card, .table-card { padding: 12px; border-radius: 10px; }
    h2 { margin: 18px 0 8px; }
    .btnbar { flex-direction: column; }
    .btnbar > .btn, .btnbar > .btn-primary { width: 100%; }
    .roundbar .title { font-size: 17px; width: 100%; }
    .navpills .btn-sm { flex: 1 1 auto; text-align: center; padding: 10px 8px; }
    .vprow { padding: 10px 8px; }
    .vprow input.vp { width: 74px; padding: 10px 6px; font-size: 17px; }
    .posbadge { min-width: 32px; }
    .mapframe { height: 270px; }
    table.stand th, table.stand td { padding: 7px 7px; font-size: 13px; }
    .bcol { min-width: 172px; }
    .addrow button { padding: 10px 14px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1 class="brand">Cat<span>annis</span> · Tournament</h1>
    <span class="spacer"></span>
    <a class="pill" href="index.html">← Map generator</a>
  </header>
  <div id="view"></div>
</div>

<script>
"use strict";

/* ---------------- constants ---------------- */
const LS_V2 = "catannis_tournament_v2";
const LS_V1 = "catannis_tournament_v1";
const LS_HIST = "catannis_history_v1";   // finished tournaments — survives wipe()
const MAX_VP = 10;                      // Catan games end at 10 victory points
const PLACEMENT = {                     // points by finishing position, per table size
  3: [5, 3, 1],
  4: [5, 4, 2, 1],
  5: [6, 4, 3, 2, 1],
  6: [7, 5, 4, 3, 2, 1],
};
function rankPoints(size, rank) {
  const t = PLACEMENT[size];
  if (t) return t[rank - 1] ?? 0;
  return Math.max(0, size - rank + 1);  // fallback for unusual sizes
}
const SEMI_PLANS = { 8: 2, 12: 3, 16: 4 };   // playoff size -> number of semifinal tables

/* ---------------- state ---------------- */
let T = null;                 // active tournament, or null on the setup screen
let moveSel = null;           // move mode: { pid: selected player id or null }
let drafts = {};              // unsaved VP entries, keyed "stage:pid" — survives re-renders
let histView = null;          // past tournament being viewed read-only, or null
const ui = { bracket: false, players: false, map: false };

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const uid = () => Math.random().toString(36).slice(2, 9);
const newSeed = () => Math.floor(Math.random() * 1e9);
const ordinal = n => n + (["th","st","nd","rd"][(n % 100 > 10 && n % 100 < 14) ? 0 : Math.min(n % 10, 4)] || "th");
const fmtPts = p => (p % 1 ? p.toFixed(1) : String(p));

function save() {
  if (T) { localStorage.setItem(LS_V2, JSON.stringify(T)); localStorage.removeItem(LS_V1); }
}
function load() {
  try {
    const v2 = JSON.parse(localStorage.getItem(LS_V2));
    if (v2) return v2;
    return migrateV1(JSON.parse(localStorage.getItem(LS_V1)));
  } catch { return null; }
}
function wipe() { localStorage.removeItem(LS_V2); localStorage.removeItem(LS_V1); T = null; drafts = {}; moveSel = null; }

/* past-tournament history (kept separately, never wiped with the active tournament) */
function loadHistory() { try { return JSON.parse(localStorage.getItem(LS_HIST)) || []; } catch { return []; } }
function saveHistory(h) { localStorage.setItem(LS_HIST, JSON.stringify(h)); }
function archiveTournament() {
  const ordered = T.final.results.slice().sort((a, b) => a.rank - b.rank || b.vp - a.vp);
  const hist = loadHistory();
  hist.unshift({
    id: uid(), date: new Date().toISOString(),
    name: T.name, players: T.players.length,
    champion: nameOf(ordered[0].id),
    t: T,                                  // full snapshot so the bracket stays viewable
  });
  saveHistory(hist);
}

/* one-time upgrade of an in-flight v1 tournament (per-table maps -> per-round map) */
function migrateV1(old) {
  if (!old) return null;
  try {
    const t0 = (old.template && old.template[0]) || {};
    const mapCfg = { expansion: !!t0.expansion, ports: t0.ports !== false, balanced: t0.balanced !== false };
    return {
      name: old.name, players: old.players.map(p => ({ ...p, active: true })),
      mapCfg, seatPlan: (old.template || []).map(x => x.seats || 4),
      numRounds: old.numRounds, playoff: { kind: "final", cut: old.cut || 4 },
      finalConfig: old.finalConfig ? { ...old.finalConfig } : { ...mapCfg },
      rounds: (old.rounds || []).map(r => ({
        seed: (r.tables && r.tables[0] && r.tables[0].config && r.tables[0].config.seed) || newSeed(),
        byes: r.byes || [],
        tables: (r.tables || []).map(tb => ({
          players: tb.players, seats: tb.seats || tb.players.length,
          results: tb.results || null, done: !!tb.done,
        })),
      })),
      roundIndex: old.roundIndex || 0,
      playoffSeeds: old.final ? old.final.players.slice() : null,
      semis: null,
      final: old.final ? {
        players: old.final.players,
        seed: (old.final.config && old.final.config.seed) || newSeed(),
        results: old.final.results || null, done: !!old.final.done,
      } : null,
      status: old.status === "final" ? "final" : old.status === "done" ? "done" : "round",
    };
  } catch { return null; }
}

/* map-generator URL — every table in a round shares the same seed */
function mapHash(cfg, seedVal) {
  return `#seed=${seedVal}&exp=${cfg.expansion ? 1 : 0}` +
    `&ports=${cfg.ports ? 1 : 0}&rand=${cfg.balanced ? 0 : 1}&nsr=0`;
}

const playerById = id => T.players.find(p => p.id === id);
const nameOf = id => (playerById(id) || {}).name || "?";
const activeIds = () => T.players.filter(p => p.active).map(p => p.id);

/* ---------------- pairing ---------------- */
// Build the table assignment for a round, minimising repeat opponents.
function pairRound(ids, seatPlan, priorRounds, keepSeed) {
  const sizes = seatPlan.slice();
  const totalSeats = sizes.reduce((a, b) => a + b, 0);
  const byeCount = Math.max(0, ids.length - totalSeats);

  // count prior byes so we spread them fairly
  const byeHist = {}; ids.forEach(i => byeHist[i] = 0);
  priorRounds.forEach(r => (r.byes || []).forEach(i => { if (i in byeHist) byeHist[i]++; }));

  // pair-history: how often each pair has shared a table
  const pairKey = (a, b) => a < b ? a + "|" + b : b + "|" + a;
  const seen = {};
  priorRounds.forEach(r => r.tables.forEach(tb => {
    for (let i = 0; i < tb.players.length; i++)
      for (let j = i + 1; j < tb.players.length; j++)
        seen[pairKey(tb.players[i], tb.players[j])] = (seen[pairKey(tb.players[i], tb.players[j])] || 0) + 1;
  }));

  function attempt() {
    let pool = shuffle(ids.slice());
    pool.sort((a, b) => byeHist[a] - byeHist[b]);      // fewest prior byes take the bye first (evens out)
    const byes = pool.slice(0, byeCount);
    const seated = shuffle(pool.slice(byeCount));
    const tbls = sizes.map(() => []);
    for (const p of seated) {
      let best = -1, bestCost = Infinity;
      for (let t = 0; t < tbls.length; t++) {
        if (tbls[t].length >= sizes[t]) continue;
        let cost = 0;
        for (const q of tbls[t]) cost += (seen[pairKey(p, q)] || 0) * 10;
        cost += tbls[t].length * 0.01;                 // mild balancing
        if (cost < bestCost) { bestCost = cost; best = t; }
      }
      if (best >= 0) tbls[best].push(p);
    }
    return { tbls, byes };
  }

  const tableRepeat = tb => {
    let c = 0;
    for (let i = 0; i < tb.length; i++)
      for (let j = i + 1; j < tb.length; j++)
        c += seen[pairKey(tb[i], tb[j])] || 0;
    return c;
  };
  const totalRepeats = tbls => tbls.reduce((s, tb) => s + tableRepeat(tb), 0);
  function hillClimb(tbls) {
    let improved = true, guard = 400;
    while (improved && guard-- > 0) {
      improved = false;
      for (let a = 0; a < tbls.length; a++)
        for (let b = a + 1; b < tbls.length; b++)
          for (let i = 0; i < tbls[a].length; i++)
            for (let j = 0; j < tbls[b].length; j++) {
              const before = tableRepeat(tbls[a]) + tableRepeat(tbls[b]);
              [tbls[a][i], tbls[b][j]] = [tbls[b][j], tbls[a][i]];
              if (tableRepeat(tbls[a]) + tableRepeat(tbls[b]) < before) improved = true;
              else [tbls[a][i], tbls[b][j]] = [tbls[b][j], tbls[a][i]];   // revert
            }
    }
  }

  let best = null;
  for (let k = 0; k < 120; k++) {
    const a = attempt();
    hillClimb(a.tbls);
    const rep = totalRepeats(a.tbls);
    if (!best || rep < best.repeats) best = { tbls: a.tbls, byes: a.byes, repeats: rep };
    if (best.repeats === 0) break;
  }

  return {
    seed: keepSeed != null ? keepSeed : newSeed(),     // ONE map for the whole round
    tables: sizes.map((seats, i) => ({ players: best.tbls[i], seats, results: null, done: false })),
    byes: best.byes,
  };
}

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

/* ---------------- scoring ---------------- */
// ranks derived purely from VP: equal VP = tied placement
function ranksFromVp(entries) {          // entries: [{id, vp}]
  return entries.map(e => ({
    ...e, rank: 1 + entries.filter(o => o.vp > e.vp).length,
  }));
}
// placement points for one table, splitting points across tied ranks
function tablePts(results) {
  const size = results.length;
  const groups = {};
  results.forEach(r => (groups[r.rank] = groups[r.rank] || []).push(r));
  const pts = {};
  Object.keys(groups).forEach(rk => {
    const grp = groups[rk], r0 = +rk;
    let sum = 0;
    for (let k = 0; k < grp.length; k++) sum += rankPoints(size, r0 + k);
    grp.forEach(g => pts[g.id] = sum / grp.length);
  });
  return pts;
}

function computeStandings() {
  const s = {};
  T.players.forEach(p => s[p.id] = { id: p.id, name: p.name, active: p.active,
    pts: 0, vp: 0, wins: 0, seconds: 0, thirds: 0, games: 0, byes: 0 });
  T.rounds.forEach(r => {
    (r.byes || []).forEach(id => { if (s[id]) s[id].byes++; });
    r.tables.forEach(tb => {
      if (!tb.done || !tb.results) return;
      const pts = tablePts(tb.results);
      tb.results.forEach(res => {
        const row = s[res.id]; if (!row) return;
        row.pts += pts[res.id];
        row.vp += (res.vp || 0);
        row.games++;
        if (res.rank === 1) row.wins++;
        else if (res.rank === 2) row.seconds++;
        else if (res.rank === 3) row.thirds++;
      });
    });
  });
  return Object.values(s).sort((a, b) =>
    b.pts - a.pts || b.vp - a.vp || b.wins - a.wins || b.seconds - a.seconds || b.thirds - a.thirds);
}
const activeSeedIds = () => computeStandings().filter(r => r.active).map(r => r.id);
const seedNoOf = id => T.playoffSeeds ? T.playoffSeeds.indexOf(id) + 1 : 0;

function allTablesDone(stage) { return stage.tables.every(t => t.done); }

/* ---------------- playoff builders ---------------- */
function startPlayoff() {
  const cut = Math.min(T.playoff.cut, activeSeedIds().length);
  T.playoffSeeds = activeSeedIds().slice(0, cut);
  if (T.playoff.kind === "semis") {
    const n = SEMI_PLANS[T.playoff.cut] || Math.ceil(cut / 4);
    const tables = Array.from({ length: n }, () => ({ players: [], results: null, done: false }));
    T.playoffSeeds.forEach((id, i) => {           // snake seeding: 1..n, then n..1, ...
      const lap = Math.floor(i / n);
      const t = lap % 2 === 0 ? i % n : n - 1 - (i % n);
      tables[t].players.push(id);
    });
    T.semis = { seed: newSeed(), tables };
    T.status = "semis";
  } else {
    T.final = { players: T.playoffSeeds.slice(), seed: newSeed(), results: null, done: false };
    T.status = "final";
  }
  ui.map = false; save(); render();
}

// winners of each semi table advance; best-placed non-winners fill the final to 4 seats
function buildFinalFromSemis() {
  const seedIdx = id => T.playoffSeeds.indexOf(id);
  const sortKey = (a, b) => a.rank - b.rank || b.vp - a.vp || seedIdx(a.id) - seedIdx(b.id);
  const winners = [], rest = [];
  T.semis.tables.forEach(tb => {
    const ordered = tb.results.slice().sort(sortKey);
    winners.push(ordered[0]);
    rest.push(...ordered.slice(1));
  });
  rest.sort(sortKey);
  const seats = Math.min(4, winners.length + rest.length);
  const finalists = winners.concat(rest).slice(0, seats).map(r => r.id);
  finalists.sort((a, b) => seedIdx(a) - seedIdx(b));   // display in seed order
  T.final = { players: finalists, seed: newSeed(), results: null, done: false };
  T.status = "final";
  ui.map = false; save(); render();
}

  if (T.status === "semis") return renderSemis();

}

    const n = Math.max(1, Math.min(12, +$("#tCount").value || 1));
    while (tmpl.length < n) tmpl.push(4);
    tmpl.length = n;
  }
  function autoSeats() {
    syncTmplLength();                      // size the table list before distributing seats
    const players = parsePlayers().length;
    if (!players) return;
    tmpl = tmpl.map(() => 4);
    let sum = tmpl.reduce((a, b) => a + b, 0), guard = 200;
    while (sum !== players && guard-- > 0) {
      if (sum < players) {
        const i = tmpl.findIndex(s => s < 6);
        if (i < 0) break; tmpl[i]++; sum++;
      } else {
        const i = tmpl.map((s, k) => k).reverse().find(k => tmpl[k] > 3);
        if (i == null) break; tmpl[i]--; sum--;
      }
    }

  function renderTmpl() {

    const seats = tmpl.reduce((a, b) => a + b, 0);

    if (!players) info.textContent = "";
    else if (seats === players) { info.className = "seatinfo ok"; info.textContent = `✓ ${seats} seats for ${players} players.`; }
    else if (seats < players) { info.className = "seatinfo bad"; info.textContent = `${seats} seats for ${players} players — ${players - seats} will sit out each round (bye).`; }
    else { info.className = "seatinfo bad"; info.textContent = `${seats} seats but only ${players} players — some tables won't be full.`; }
    // 5-6 seat tables need the expansion map (the whole round shares one board)
    const needExp = tmpl.some(s => s >= 5);
    const exp = $("#qExp"), note = $("#expNote");
    exp.disabled = needExp;
    if (needExp) { exp.checked = true; note.textContent = "A table has 5+ seats, so the round map uses the 5–6 expansion."; }

function updateBadges(list) {
  const rows = [...list.querySelectorAll(".vprow")].filter(r => !r.classList.contains("empty"));

  vals.forEach(x => {
    const b = x.row.querySelector(".posbadge");
    if (x.v === "") { b.textContent = "–"; b.className = "posbadge"; return; }
    const rank = 1 + nums.filter(n => n > +x.v).length;
    const tied = nums.filter(n => n === +x.v).length > 1;
    b.textContent = (tied ? "T" : "") + ordinal(rank);
    b.className = "posbadge" + (rank <= 3 ? " r" + rank : "");
  });

/* ---------- move mode ---------- */
function wireMoveMode(r) {
  if (!moveSel) return;
  const locate = pid => {
    for (let t = 0; t < r.tables.length; t++) {
      const i = r.tables[t].players.indexOf(pid);
      if (i >= 0 && !r.tables[t].done) return { kind: "table", t, i };
    }
    const bi = r.byes.indexOf(pid);
    if (bi >= 0) return { kind: "bench", i: bi };
    return null;
  };
  view.querySelectorAll("[data-mv]").forEach(el => {
    el.onclick = () => {
      const pid = el.closest("[data-pid]").dataset.pid;
      if (!moveSel.pid) { moveSel.pid = pid; render(); return; }
      if (moveSel.pid === pid) { moveSel.pid = null; render(); return; }
      const A = locate(moveSel.pid), B = locate(pid);        // swap the two players
      if (A && B) {
        if (A.kind === "table") r.tables[A.t].players[A.i] = pid; else r.byes[A.i] = pid;
        if (B.kind === "table") r.tables[B.t].players[B.i] = moveSel.pid; else r.byes[B.i] = moveSel.pid;
      }
      moveSel = { pid: null }; save(); render();
    };
  });
  view.querySelectorAll("[data-slot]").forEach(el => {      // move into an empty seat
    el.onclick = () => {
      if (!moveSel.pid) return;
      const t = +el.dataset.slot;
      const A = locate(moveSel.pid);
      if (!A) return;
      if (A.kind === "table") r.tables[A.t].players.splice(A.i, 1); else r.byes.splice(A.i, 1);
      r.tables[t].players.push(moveSel.pid);
      moveSel = { pid: null }; save(); render();
    };
  });
  view.querySelectorAll("[data-grow]").forEach(el => {      // add a seat to a full table and sit there
    el.onclick = () => {
      if (!moveSel.pid) return;
      const t = +el.dataset.grow;
      const A = locate(moveSel.pid);
      if (!A) return;
      if (A.kind === "table" && A.t === t) { moveSel = { pid: null }; render(); return; }  // already at this table
      if (A.kind === "table") r.tables[A.t].players.splice(A.i, 1); else r.byes.splice(A.i, 1);
      r.tables[t].seats++;
      if (T.seatPlan[t] != null && T.seatPlan[t] < r.tables[t].seats)
        T.seatPlan[t] = r.tables[t].seats;                  // later rounds keep the bigger table
      r.tables[t].players.push(moveSel.pid);
      moveSel = { pid: null }; save(); render();
    };
  });
  const bench = view.querySelector("[data-benchzone]");     // send the selected player to the bench
  if (bench) bench.onclick = e => {
    if (!moveSel.pid || e.target.closest("[data-pid]")) return;
    const A = locate(moveSel.pid);
    if (!A || A.kind === "bench") return;
    r.tables[A.t].players.splice(A.i, 1);
    r.byes.push(moveSel.pid);
    moveSel = { pid: null }; save(); render();
  };
}

function benchHTML(r) {
  const show = r.byes.length || moveSel;
  if (!show) return "";
  return `<div class="table-card bench ${moveSel && moveSel.pid ? "droppable" : ""}" data-benchzone>
    <div class="bt">Bench — sitting out this round</div>
    ${r.byes.length ? r.byes.map(id => {
      const selCls = moveSel && moveSel.pid === id ? "sel" : "";
      return `<div class="vprow ${moveSel ? "movable" : ""} ${selCls}" data-pid="${id}">
        <span class="posbadge">·</span><span class="pname" ${moveSel ? "data-mv" : ""}>${esc(nameOf(id))}</span></div>`;
    }).join("") : `<p class="hint" style="margin:0">Empty${moveSel && moveSel.pid ? " — tap here to bench the selected player" : ""}.</p>`}
  </div>`;
}

/* ---------- run (a qualifying round) ---------- */
function renderRun() {
  const r = T.rounds[T.roundIndex];
  const anyDone = r.tables.some(t => t.done);
  const done = allTablesDone(r);
  const lastRound = T.roundIndex >= T.numRounds - 1;

  const tablesHTML = r.tables.map((tb, ti) => {
    let body, action = "";
    if (tb.done) {
      body = doneRowsHTML(tb.results);
      action = `<div class="btnbar"><button class="btn btn-sm" data-edit="${ti}">✎ Edit result</button></div>`;
    } else {
      const items = tb.players.map(id => ({ pid: id, name: nameOf(id) }));
      for (let k = tb.players.length; k < tb.seats; k++) items.push({ empty: true, t: ti });
      const seatCap = T.mapCfg.expansion ? 6 : 4;      // the shared map limits table size
      if (moveSel && moveSel.pid && tb.players.length >= tb.seats && tb.seats < seatCap)
        items.push({ grow: true, t: ti, seats: tb.seats });
      body = vpListHTML(items, `r${T.roundIndex}:${ti}`, !!moveSel);
      action = moveSel ? "" :
        `<div class="hint" style="margin:2px 0 8px">Type each player's VP (max ${MAX_VP}) — places are worked out automatically.</div>
         <div class="btnbar"><button class="btn-primary btn-sm" data-save="${ti}">Save result</button></div>`;
    }
    return `<div class="table-card ${tb.done ? "done" : ""}">
      <div class="table-head"><span class="tt">Table ${ti + 1}</span>
        ${tb.done ? '<span class="tag" style="color:var(--good)">✓ done</span>' : ""}</div>
      ${body || '<p class="muted">No players.</p>'}
      ${action}
    </div>`;
  }).join("");

  view.innerHTML = `
    <div class="roundbar">
      <span class="title">Round ${T.roundIndex + 1}<span class="muted"> / ${T.numRounds}</span></span>
      <span class="pill">${esc(T.name)}</span>
      ${mapTags(T.mapCfg)}
    </div>
    ${navPillsHTML({ move: r.tables.some(t => !t.done), repair: !anyDone })}
    ${ui.players ? playersPanelHTML() : ""}
    ${mapPanelHTML(T.mapCfg, r.seed, !anyDone)}
    ${moveSel ? `<p class="hint" style="margin:0 0 10px">${moveSel.pid
      ? `<b>${esc(nameOf(moveSel.pid))}</b> selected — tap another player to swap, an empty seat or "＋ add a seat" to move, or the bench.`
      : "Tap a player to pick them up."}</p>` : ""}
    ${benchHTML(r)}
    ${tablesHTML}

    <div class="btnbar">
      ${done && !lastRound ? `<button class="btn-primary" id="nextBtn">Start round ${T.roundIndex + 2} →</button>` : ""}
      ${done && lastRound ? `<button class="btn-primary" id="playoffBtn">${
        T.playoff.kind === "semis" ? "Start the semifinals →" : "Set up the final →"}</button>` : ""}
    </div>

    <h2>Standings</h2>
    <div class="card">${standingsTable(T.playoff.cut, true)}</div>

    <div class="btnbar">
      <button class="btn btn-danger" id="resetBtn">End &amp; delete tournament</button>
    </div>
  `;

  wireNavPills(); wirePlayersPanel();
  wireMapPanel(() => { r.seed = newSeed(); save(); render(); });
  wireMoveMode(r);
  if (!moveSel) wireVpLists();

  const resh = view.querySelector("#reshuffleBtn");
  if (resh) resh.onclick = () => {
    const prior = T.rounds.slice(0, T.roundIndex);
    T.rounds[T.roundIndex] = pairRound(activeIds(), T.seatPlan, prior, r.seed);
    moveSel = null; save(); render();
  };

  r.tables.forEach((tb, ti) => {
    const saveB = view.querySelector(`[data-save="${ti}"]`);
    if (saveB) saveB.onclick = () => {
      const list = view.querySelector(`.vplist[data-stage="r${T.roundIndex}:${ti}"]`);
      const { results, ok } = readVpList(list);
      if (!ok) { alert("Enter victory points for every player."); return; }
      if (!confirmTieForFirst(results)) return;
      tb.results = results; tb.done = true;
      clearDrafts(`r${T.roundIndex}:${ti}`);
      save(); render();
    };
    const editB = view.querySelector(`[data-edit="${ti}"]`);
    if (editB) editB.onclick = () => {
      prefillDrafts(`r${T.roundIndex}:${ti}`, tb.results);   // keep the old VPs, just unlock them
      tb.done = false; tb.results = null; save(); render();
    };
  });

  const nextB = view.querySelector("#nextBtn");
  if (nextB) nextB.onclick = () => {
    T.roundIndex++;
    if (!T.rounds[T.roundIndex])
      T.rounds.push(pairRound(activeIds(), T.seatPlan, T.rounds.slice(0, T.roundIndex)));
    moveSel = null; ui.map = false; save(); render();
  };
  const pb = view.querySelector("#playoffBtn");
  if (pb) pb.onclick = startPlayoff;

  view.querySelector("#resetBtn").onclick = () => { if (confirm("Delete this tournament?")) { wipe(); render(); } };
}

/* ---------- semifinals ---------- */
function renderSemis() {
  const s = T.semis;
  const anyDone = s.tables.some(t => t.done);
  const done = allTablesDone(s);

  const tablesHTML = s.tables.map((tb, ti) => {
    let body, action = "";
    if (tb.done) {
      body = doneRowsHTML(tb.results, true);
      action = `<div class="btnbar"><button class="btn btn-sm" data-edit="${ti}">✎ Edit result</button></div>`;
    } else {
      const items = tb.players.map(id => ({ pid: id, name: nameOf(id), seed: seedNoOf(id) }));
      body = vpListHTML(items, `s:${ti}`, false);
      action = `<div class="btnbar"><button class="btn-primary btn-sm" data-save="${ti}">Save result</button></div>`;
    }
    return `<div class="table-card ${tb.done ? "done" : ""}">
      <div class="table-head"><span class="tt">Semifinal ${ti + 1}</span>
        ${tb.done ? '<span class="tag" style="color:var(--good)">✓ done</span>' : ""}</div>
      ${body}${action}
    </div>`;
  }).join("");

  view.innerHTML = `
    <div class="roundbar">
      <span class="title">Semifinals</span>
      <span class="pill">${esc(T.name)}</span>
      ${mapTags(T.finalConfig)}
    </div>
    ${navPillsHTML({})}
    ${ui.players ? playersPanelHTML() : ""}
    ${mapPanelHTML(T.finalConfig, s.seed, !anyDone)}
    <p class="hint" style="margin:0 0 10px">All semifinal tables play the same map. Each table's winner advances;
      the best-placed runners-up fill the final to 4 seats.</p>
    ${tablesHTML}
    <div class="btnbar">
      ${done ? `<button class="btn-primary" id="toFinalBtn">Advance winners to the final →</button>` : ""}
    </div>
    <div class="btnbar"><button class="btn btn-danger" id="resetBtn">End &amp; delete tournament</button></div>
  `;

  wireNavPills(); wirePlayersPanel();
  wireMapPanel(() => { s.seed = newSeed(); save(); render(); });
  wireVpLists();

  s.tables.forEach((tb, ti) => {
    const saveB = view.querySelector(`[data-save="${ti}"]`);
    if (saveB) saveB.onclick = () => {
      const list = view.querySelector(`.vplist[data-stage="s:${ti}"]`);
      const { results, ok } = readVpList(list);
      if (!ok) { alert("Enter victory points for every player."); return; }
      if (!confirmTieForFirst(results)) return;
      tb.results = results; tb.done = true; clearDrafts(`s:${ti}`); save(); render();
    };
    const editB = view.querySelector(`[data-edit="${ti}"]`);
    if (editB) editB.onclick = () => {
      prefillDrafts(`s:${ti}`, tb.results);
      tb.done = false; tb.results = null; save(); render();
    };
  });

  const fb = view.querySelector("#toFinalBtn");
  if (fb) fb.onclick = buildFinalFromSemis;
  view.querySelector("#resetBtn").onclick = () => { if (confirm("Delete this tournament?")) { wipe(); render(); } };
}

/* ---------- final ---------- */
function renderFinal() {
  const f = T.final;
  const body = f.done
    ? doneRowsHTML(f.results, true)
    : vpListHTML(f.players.map(id => ({ pid: id, name: nameOf(id), seed: seedNoOf(id) })), "f:0", false);

  view.innerHTML = `
    <div class="roundbar">
      <span class="title">🏆 The Final</span>
      <span class="pill">${esc(T.name)}</span>
      ${mapTags(T.finalConfig)}
    </div>
    ${navPillsHTML({})}
    ${ui.players ? playersPanelHTML() : ""}
    ${mapPanelHTML(T.finalConfig, f.seed, !f.done)}
    <div class="table-card ${f.done ? "done" : ""}">
      <div class="table-head"><span class="tt">Final table</span></div>
      ${body}
      ${f.done
        ? `<div class="btnbar"><button class="btn btn-sm" id="editFinal">✎ Edit result</button></div>`
        : `<div class="hint" style="margin:2px 0 8px">Type each finalist's VP (max ${MAX_VP}) — the champion is worked out automatically.</div>
           <div class="btnbar"><button class="btn-primary btn-sm" id="saveFinal">Crown the champion 👑</button></div>`}
    </div>
    ${f.done ? `<div class="btnbar"><button class="btn-primary" id="toResults">See results →</button></div>` : ""}
    <div class="btnbar"><button class="btn btn-danger" id="resetBtn">End &amp; delete tournament</button></div>
  `;

  wireNavPills(); wirePlayersPanel();
  wireMapPanel(() => { f.seed = newSeed(); save(); render(); });
  wireVpLists();

  const sf = view.querySelector("#saveFinal");
  if (sf) sf.onclick = () => {
    const list = view.querySelector('.vplist[data-stage="f:0"]');
    const { results, ok } = readVpList(list);
    if (!ok) { alert("Enter victory points for every finalist."); return; }
    if (!confirmTieForFirst(results)) return;
    f.results = results; f.done = true; T.status = "done";
    clearDrafts("f:0"); save(); render();
  };
  const ef = view.querySelector("#editFinal");
  if (ef) ef.onclick = () => {
    prefillDrafts("f:0", f.results);
    f.done = false; f.results = null; save(); render();
  };
  const tr = view.querySelector("#toResults");
  if (tr) tr.onclick = () => { T.status = "done"; save(); render(); };
  view.querySelector("#resetBtn").onclick = () => { if (confirm("Delete this tournament?")) { wipe(); render(); } };
}

/* ---------- done ---------- */
function renderDone() {
  const f = T.final;
  const ordered = f.results.slice().sort((a, b) => a.rank - b.rank || b.vp - a.vp);
  const champ = nameOf(ordered[0].id);
  const p2 = ordered[1] ? nameOf(ordered[1].id) : "";
  const p3 = ordered[2] ? nameOf(ordered[2].id) : "";

  view.innerHTML = `
    <div class="roundbar"><span class="title">🏆 ${esc(T.name)} — Champion</span></div>
    <div class="navpills"><button class="btn btn-sm" id="bracketBtn">🏆 Bracket</button></div>
    <div class="champ">👑 ${esc(champ)}</div>
    <div class="podium">
      ${p2 ? `<div class="p p2"><div class="bar">2</div><div class="who">${esc(p2)}</div></div>` : ""}
      <div class="p p1"><div class="bar">1</div><div class="who">${esc(champ)}</div></div>
      ${p3 ? `<div class="p p3"><div class="bar">3</div><div class="who">${esc(p3)}</div></div>` : ""}
    </div>

    <h2>Final table result</h2>
    <div class="card">${doneRowsHTML(f.results, true)}
      <div class="btnbar"><button class="btn btn-sm" id="editFinal">✎ Edit final result</button></div>
    </div>

    <h2>Qualifying standings</h2>
    <div class="card">${standingsTable(T.playoff.cut, false)}</div>

    <div class="btnbar">
      <button class="btn-primary" id="saveFinishBtn">💾 Save &amp; finish</button>
      <button class="btn btn-danger" id="discardBtn2">Discard tournament</button>
    </div>
    <p class="hint" style="margin-top:8px">Save &amp; finish stores this night under <b>Past champions</b> on the start
      screen — champion, bracket and standings stay viewable — then clears the board for the next tournament.</p>
  `;
  view.querySelector("#bracketBtn").onclick = () => { ui.bracket = true; render(); };
  view.querySelector("#editFinal").onclick = () => {
    prefillDrafts("f:0", f.results);
    f.done = false; f.results = null; T.status = "final"; save(); render();
  };
  view.querySelector("#saveFinishBtn").onclick = () => { archiveTournament(); wipe(); render(); };
  view.querySelector("#discardBtn2").onclick = () => {
    if (confirm("Discard without saving to the history?")) { wipe(); render(); }
  };
}

/* ---------- bracket ---------- */
function bracketHTML() {
  const cut = T.playoff.cut;
  const seeds = T.playoffSeeds || activeSeedIds().slice(0, cut);
  const live = !T.playoffSeeds;
  const champId = (T.status === "done" && T.final && T.final.results)
    ? T.final.results.slice().sort((a, b) => a.rank - b.rank || b.vp - a.vp)[0].id : null;

  const seedRows = seeds.map((id, i) => `
    <div class="brow ${champId === id ? "win" : ""}">
      <span class="seedchip">S${i + 1}</span><span class="pname">${esc(nameOf(id))}</span>
    </div>`).join("") || `<div class="brow dim"><span class="pname">No games yet</span></div>`;

  const semiCols = T.playoff.kind !== "semis" ? "" : (() => {
    const n = SEMI_PLANS[cut] || Math.ceil(cut / 4);
    const boxes = Array.from({ length: n }, (_, ti) => {
      const tb = T.semis ? T.semis.tables[ti] : null;
      let rows;
      if (tb && tb.done) {
        rows = tb.results.slice().sort((a, b) => a.rank - b.rank || b.vp - a.vp).map(res =>
          `<div class="brow ${res.rank === 1 ? "win" : "dim"}">
            <span class="seedchip">S${seedNoOf(res.id)}</span>
            <span class="pname">${esc(nameOf(res.id))}</span><span class="bvp">${res.vp}</span></div>`).join("");
      } else if (tb) {
        rows = tb.players.map(id =>
          `<div class="brow"><span class="seedchip">S${seedNoOf(id)}</span>
            <span class="pname">${esc(nameOf(id))}</span></div>`).join("");
      } else {
        rows = `<div class="brow dim"><span class="pname">Seeded after qualifying</span></div>`;
      }
      return `<div class="bbox"><div class="bt">Semifinal ${ti + 1}</div>${rows}</div>`;
    }).join("");
    return `<div class="bjoin">›</div><div class="bcol"><h4>Semifinals</h4>${boxes}</div>`;
  })();

  let finalRows;
  if (T.final && T.final.done) {
    finalRows = T.final.results.slice().sort((a, b) => a.rank - b.rank || b.vp - a.vp).map(res =>
      `<div class="brow ${res.rank === 1 ? "win" : "dim"}">
        ${seedNoOf(res.id) ? `<span class="seedchip">S${seedNoOf(res.id)}</span>` : ""}
        <span class="pname">${esc(nameOf(res.id))}</span><span class="bvp">${res.vp}</span></div>`).join("");
  } else if (T.final) {
    finalRows = T.final.players.map(id =>
      `<div class="brow">${seedNoOf(id) ? `<span class="seedchip">S${seedNoOf(id)}</span>` : ""}
        <span class="pname">${esc(nameOf(id))}</span></div>`).join("");
  } else {
    finalRows = `<div class="brow dim"><span class="pname">${
      T.playoff.kind === "semis" ? "Winners of the semifinals" : "Top " + cut + " after qualifying"}</span></div>`;
  }

  return `<div class="bracketscroll"><div class="bracket">
      <div class="bcol"><h4>Qualifying${live ? " (live)" : ""}</h4><div class="bbox"><div class="bt">Top ${cut} seeds</div>${seedRows}</div></div>
      ${semiCols}
      <div class="bjoin">›</div>
      <div class="bcol"><h4>Final</h4><div class="bbox"><div class="bt">Final table</div>${finalRows}</div></div>
      <div class="bjoin">›</div>
      <div class="bcol"><h4>Champion</h4><div class="bbox bchamp">👑<div class="who">${
        champId ? esc(nameOf(champId)) : "TBD"}</div></div></div>
    </div></div>`;
}

function renderBracket() {
  const live = !T.playoffSeeds;
  view.innerHTML = `
    <div class="roundbar">
      <span class="title">🏆 Playoff bracket</span>
      <span class="pill">${esc(T.name)}</span>
    </div>
    <div class="navpills"><button class="btn btn-sm" id="backBtn">← Back</button></div>
    ${live ? `<p class="hint" style="margin:0 0 8px">Seeds show the <b>current</b> top ${T.playoff.cut} — they lock in when qualifying ends.</p>` : ""}
    ${bracketHTML()}
  `;
  view.querySelector("#backBtn").onclick = () => { ui.bracket = false; render(); };
}

/* ---------- read-only view of a saved past tournament ---------- */
function renderHistoryView() {
  const hv = histView;
  const prevT = T;
  let html;
  try {
    T = hv.t;                       // borrow the render helpers against the snapshot
    const ordered = T.final.results.slice().sort((a, b) => a.rank - b.rank || b.vp - a.vp);
    const champ = nameOf(ordered[0].id);
    const p2 = ordered[1] ? nameOf(ordered[1].id) : "";
    const p3 = ordered[2] ? nameOf(ordered[2].id) : "";
    html = `
      <div class="roundbar"><span class="title">🏆 ${esc(T.name)}</span>
        <span class="pill">${new Date(hv.date).toLocaleDateString()}</span>
        <span class="pill">${T.players.length} players</span></div>
      <div class="navpills"><button class="btn btn-sm" id="histBack">← Back</button></div>
      <div class="champ">👑 ${esc(champ)}</div>
      <div class="podium">
        ${p2 ? `<div class="p p2"><div class="bar">2</div><div class="who">${esc(p2)}</div></div>` : ""}
        <div class="p p1"><div class="bar">1</div><div class="who">${esc(champ)}</div></div>
        ${p3 ? `<div class="p p3"><div class="bar">3</div><div class="who">${esc(p3)}</div></div>` : ""}
      </div>
      ${bracketHTML()}
      <h2>Final table result</h2>
      <div class="card">${doneRowsHTML(T.final.results, true)}</div>
      <h2>Qualifying standings</h2>
      <div class="card">${standingsTable(T.playoff.cut, false)}</div>
    `;
  } finally { T = prevT; }
  view.innerHTML = html;
  view.querySelector("#histBack").onclick = () => { histView = null; render(); };
}

/* ---------- shared: standings table ---------- */
function standingsTable(cut, showCut) {
  const s = computeStandings();
  if (!s.some(r => r.games > 0)) return `<p class="muted">No games recorded yet.</p>`;
  return `<div class="tablescroll"><table class="stand">
    <thead><tr><th>#</th><th>Player</th><th class="num">Pts</th><th class="num">VP</th>
      <th class="num">W</th><th class="num">Games</th></tr></thead>
    <tbody>
      ${s.map((r, i) => `<tr class="${showCut && i < cut ? "cut" : ""} ${showCut && i === cut - 1 ? "cutline" : ""}">
        <td class="rankcell">${i + 1}</td>
        <td>${esc(r.name)}${r.active ? "" : ' <span class="muted" style="font-size:11px">(out)</span>'}${
          r.byes ? ` <span class="muted" style="font-size:11px">(${r.byes} bye)</span>` : ""}</td>
        <td class="num">${fmtPts(r.pts)}</td><td class="num">${r.vp}</td>
        <td class="num">${r.wins}</td><td class="num">${r.games}</td>
      </tr>`).join("")}
    </tbody>
  </table></div>
  ${showCut ? `<p class="hint" style="margin-top:8px">Green = currently in the playoff (top ${cut}).</p>` : ""}`;
}

/* ---------------- boot ---------------- */
render();
</script>
</body>
</html>
